<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章列表 - 微信公众号预览工具</title>
    <link rel="stylesheet" href="/assets/css/tree.css">
    <link rel="stylesheet" href="/assets/css/status.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Source Sans 3", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f6f8fb;
            color: #34495e;
            line-height: 1.6;
        }

        .header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.07);
            margin-bottom: 0;
        }

        .header h1 {
            text-align: center;
            font-size: 30px;
            color: #2c3e50;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .header .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>📝 文章列表</h1>
        <p class="subtitle">点击文章查看微信公众号预览效果</p>
    </div>

    <div class="layout-container">
        <div class="sidebar">
            <div id="category-tree-container"></div>
        </div>

        <div class="main-content">
            <div id="filter-bar-container"></div>
            <div class="article-list" id="article-list"></div>
        </div>
    </div>

    <script src="/assets/js/status-manager.js"></script>
    <script src="/assets/js/category-tree.js"></script>
    <script src="/assets/js/filter.js"></script>
    <script>
        let articles = [];
        let categoryTree;
        let articleFilter;

        // 侧边栏粘性定位处理
        function initStickysidebar() {
            const sidebar = document.querySelector('.sidebar');
            const categoryTree = document.querySelector('.category-tree');

            if (!sidebar || !categoryTree) return;

            const sidebarTop = sidebar.offsetTop;
            const stickyOffset = 20; // 距离顶部的距离

            function handleScroll() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop >= sidebarTop - stickyOffset) {
                    categoryTree.classList.add('sticky');
                    sidebar.classList.add('sticky-active');
                } else {
                    categoryTree.classList.remove('sticky');
                    sidebar.classList.remove('sticky-active');
                }
            }

            window.addEventListener('scroll', handleScroll);
            handleScroll(); // 初始化检查
        }

        (async () => {
            // 从 API 加载文章数据
            const response = await fetch('/api/articles');
            articles = await response.json();

            await statusManager.loadPlatforms();
            await statusManager.loadAllStatus();

            categoryTree = new CategoryTree(articles, statusManager);
            categoryTree.render(document.getElementById('category-tree-container'));

            // 恢复之前选中的分类（兼容旧 key 和新 key）
            const savedPath = localStorage.getItem('selectedPath') || localStorage.getItem('selectedCategory');
            if (savedPath) {
                categoryTree.selectCategory(savedPath);
                categoryTree.render(document.getElementById('category-tree-container'));
                localStorage.removeItem('selectedPath');
                localStorage.removeItem('selectedCategory');
            }

            articleFilter = new ArticleFilter(articles, statusManager);
            await articleFilter.render(document.getElementById('filter-bar-container'));

            renderArticleList();

            window.addEventListener('categorySelected', () => {
                renderArticleList();
            });

            window.addEventListener('filterChanged', () => {
                articleFilter.updateArticleList();
            });

            // 初始化侧边栏粘性定位
            initStickysidebar();
        })();

        function renderArticleList() {
            const filtered = categoryTree.getFilteredArticles();
            const listContainer = document.getElementById('article-list');

            const html = filtered.map(article => {
                const updatedAt = new Date(article.updatedAt).toLocaleDateString('zh-CN');
                return `
                    <div class="article-card" data-article-id="${article.id}">
                        <div class="article-title">
                            <a href="/article/${article.id}">${article.title}</a>
                        </div>
                        <div class="article-meta">
                            <span class="article-series">📂 ${article.series}</span>
                            <span>📅 ${updatedAt}</span>
                        </div>
                        <div class="article-badges" data-badges="${article.id}"></div>
                    </div>
                `;
            }).join('');

            listContainer.innerHTML = html;

            filtered.forEach(article => {
                const container = document.querySelector(`[data-badges="${article.id}"]`);
                if (container) {
                    statusManager.renderStatusBadges(article.id, container);
                }
            });

            articleFilter.updateArticleList();
        }
    </script>
</body>

</html>
