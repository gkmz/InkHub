<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章列表 - 微信公众号预览工具</title>
    <link rel="stylesheet" href="/assets/css/tree.css">
    <link rel="stylesheet" href="/assets/css/status.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Source Sans 3", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f6f8fb;
            color: #34495e;
            line-height: 1.6;
        }

        .header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 16px 28px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            font-size: 20px;
            line-height: 1;
        }

        .header h1 {
            font-size: 17px;
            color: #1a2733;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header .subtitle {
            color: #9aabb5;
            font-size: 12.5px;
            margin-left: auto;
            letter-spacing: 0.01em;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="header-logo">✦</span>
        <h1>文章列表</h1>
        <span class="subtitle">微信公众号预览工具</span>
    </div>

    <div class="layout-container">
        <div class="sidebar">
            <div id="category-tree-container"></div>
        </div>
        <div class="sidebar-resizer" id="sidebarResizer" aria-label="调整导航宽度" role="separator"></div>

        <div class="main-content">
            <div id="filter-bar-container"></div>
            <div class="article-list" id="article-list"></div>
        </div>
    </div>

    <script src="/assets/js/status-manager.js"></script>
    <script src="/assets/js/category-tree.js"></script>
    <script src="/assets/js/filter.js"></script>
    <script>
        let articles = [];
        let categoryTree;
        let articleFilter;

        // 转义列表页动态文本，避免文件名或标题中的特殊字符破坏 HTML
        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 侧边栏粘性定位处理
        function initStickysidebar() {
            const sidebar = document.querySelector('.sidebar');
            const categoryTree = document.querySelector('.category-tree');

            if (!sidebar || !categoryTree) return;

            const sidebarTop = sidebar.offsetTop;
            const stickyOffset = 20; // 距离顶部的距离

            function handleScroll() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop >= sidebarTop - stickyOffset) {
                    categoryTree.classList.add('sticky');
                    sidebar.classList.add('sticky-active');
                } else {
                    categoryTree.classList.remove('sticky');
                    sidebar.classList.remove('sticky-active');
                }
            }

            window.addEventListener('scroll', handleScroll);
            handleScroll(); // 初始化检查
        }

        (async () => {
            // 从 API 加载文章数据
            const response = await fetch('/api/articles');
            articles = await response.json();

            await statusManager.loadPlatforms();
            await statusManager.loadAllStatus();

            categoryTree = new CategoryTree(articles, statusManager);
            categoryTree.render(document.getElementById('category-tree-container'));
            initSidebarResize();

            // 恢复之前选中的分类（兼容旧 key 和新 key）
            const savedPath = localStorage.getItem('selectedPath') || localStorage.getItem('selectedCategory');
            if (savedPath) {
                categoryTree.selectCategory(savedPath);
                categoryTree.render(document.getElementById('category-tree-container'));
                localStorage.removeItem('selectedPath');
                localStorage.removeItem('selectedCategory');
            }

            articleFilter = new ArticleFilter(articles, statusManager);
            await articleFilter.render(document.getElementById('filter-bar-container'));

            renderArticleList();

            window.addEventListener('categorySelected', () => {
                renderArticleList();
            });

            window.addEventListener('filterChanged', () => {
                articleFilter.updateArticleList();
            });

            // 初始化侧边栏粘性定位
            initStickysidebar();
        })();

        function renderArticleList() {
            const filtered = categoryTree.getFilteredArticles();
            const listContainer = document.getElementById('article-list');

            const html = filtered.map(article => {
                const updatedAt = new Date(article.updatedAt).toLocaleDateString('zh-CN');
                const articleID = escapeHTML(article.id);
                const articleURL = `/article/${encodeURIComponent(article.id)}`;
                return `
                    <div class="article-card" data-article-id="${articleID}">
                        <div class="article-title">
                            <a href="${articleURL}">${escapeHTML(article.title)}</a>
                        </div>
                        <div class="article-meta">
                            <span class="article-series">📂 ${escapeHTML(article.series)}</span>
                            <span>📅 ${updatedAt}</span>
                        </div>
                        <div class="article-badges" data-badges="${articleID}"></div>
                    </div>
                `;
            }).join('');

            listContainer.innerHTML = html;

            filtered.forEach(article => {
                const badgeID = window.CSS && CSS.escape ? CSS.escape(article.id) : article.id.replace(/["\\]/g, '\\$&');
                const container = document.querySelector(`[data-badges="${badgeID}"]`);
                if (container) {
                    statusManager.renderStatusBadges(article.id, container);
                }
            });

            articleFilter.updateArticleList();
        }
    </script>
</body>

</html>
