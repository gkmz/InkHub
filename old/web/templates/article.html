<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/assets/css/wechat.css">
    <link rel="stylesheet" href="/assets/css/status.css">
    <link rel="stylesheet" href="/assets/css/tree.css">
    <link rel="stylesheet" href="/chroma.css">
    <style>
        /* 确保复制时不包含侧边栏和工具栏 */
        .no-copy {
            user-select: none;
        }

        @media print {
            .no-copy {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar no-copy">
        <div class="toolbar-inner">
            <a href="/" class="btn btn-back">← 返回列表</a>
            <div class="toolbar-meta">预览模式 · 微信公众号排版</div>
            <div class="actions">
                <label for="mermaidThemeSelect" class="toolbar-meta" style="flex: 0 0 auto;">Mermaid主题</label>
                <select id="mermaidThemeSelect" class="btn" style="padding: 7px 12px; border-color: rgba(0,0,0,0.12);">
                    <option value="handdrawn" {{ if eq .mermaidTheme "handdrawn" }}selected{{ end }}>手绘</option>
                    <option value="modern" {{ if eq .mermaidTheme "modern" }}selected{{ end }}>现代</option>
                </select>
                <button onclick="copyArticle()" class="btn btn-copy">复制原文</button>
                <button onclick="handlePublish()" class="btn btn-publish">发布/复制</button>
            </div>
        </div>
    </div>
    <input type="hidden" id="articleId" value="{{ .id }}">

    <div class="layout-container">
        <!-- 左侧：目录导航 -->
        <div class="sidebar no-copy">
            <div id="category-tree-container"></div>
        </div>
        <div class="sidebar-resizer no-copy" id="sidebarResizer" aria-label="调整导航宽度" role="separator"></div>

        <!-- 右侧：文章内容 -->
        <div class="main-content">
            <div class="article-wrapper">
                <div class="article-header">
                    <h1>{{ .title }}</h1>
                    <div class="article-meta">
                        <span class="series-tag">{{ .series }}</span>
                    </div>
                </div>

                <!-- 发布状态面板 -->
                <div id="publish-status-panel" class="no-copy"></div>

                <div class="article-content" id="articleContent">
                    {{ .html }}
                </div>
            </div>

            <div class="notice no-copy">
                <p><strong>💡 使用说明：</strong></p>
                <ol>
                    <li>点击"复制文章"按钮</li>
                    <li>打开微信公众号后台，粘贴到编辑器</li>
                    <li>⚠️ <strong>图片需要手动上传</strong>（微信不支持外链图片）</li>
                    <li>🔗 <strong>外部链接</strong>已自动转换为文末脚注</li>
                </ol>
            </div>
        </div>
    </div>

    <script src="/assets/js/copy.js"></script>
    <script src="/assets/js/wechat-format.js"></script>
    <script src="/assets/js/mermaid-render.js"></script>
    <script src="/assets/js/status-manager.js"></script>
    <script src="/assets/js/category-tree.js"></script>
    <script>
        // 将 toolbar 实际高度同步到 CSS 变量，sidebar sticky 定位依赖此值
        (function syncToolbarHeight() {
            const toolbar = document.querySelector('.toolbar');
            if (!toolbar) return;
            const update = () => document.documentElement.style.setProperty(
                '--toolbar-height', toolbar.offsetHeight + 'px'
            );
            update();
            new ResizeObserver(update).observe(toolbar);
        })();

        (function initMermaidThemeSwitcher() {
            const select = document.getElementById('mermaidThemeSelect');
            if (!select) return;
            select.addEventListener('change', () => {
                const url = new URL(window.location.href);
                url.searchParams.set('mermaidTheme', select.value);
                window.location.href = url.toString();
            });
        })();

        let articles = [];
        let categoryTree;
        const currentArticleID = document.getElementById('articleId').value;

        (async () => {
            try {
                // 加载文章列表用于导航
                const response = await fetch('/api/articles');
                articles = await response.json();

                // 加载状态数据
                await statusManager.loadPlatforms();
                await statusManager.loadAllStatus();

                // 初始化目录树
                categoryTree = new CategoryTree(articles, statusManager);
                categoryTree.render(document.getElementById('category-tree-container'));
                initSidebarResize();

                // 展开当前文章所在目录的所有祖先路径并高亮
                const article = articles.find(a => a.id === currentArticleID);
                if (article && article.folderPath) {
                    // 展开 folderPath 的每一级祖先，例如 "A/B/C" → ["A", "A/B", "A/B/C"]
                    const parts = article.folderPath.split('/');
                    parts.reduce((acc, part) => {
                        const path = acc ? `${acc}/${part}` : part;
                        categoryTree.expandedNodes.add(path);
                        return path;
                    }, '');
                    categoryTree.render(document.getElementById('category-tree-container'));
                }

                // 高亮当前文章，根目录文件没有 folderPath 也需要处理
                setTimeout(() => {
                    const currentSelectorID = window.CSS && CSS.escape
                        ? CSS.escape(currentArticleID)
                        : currentArticleID.replace(/["\\]/g, '\\$&');
                    const currentNode = document.querySelector(`[data-article="${currentSelectorID}"]`);
                    if (currentNode) {
                        currentNode.classList.add('active');
                        currentNode.scrollIntoView({ block: 'nearest' });
                    }
                }, 100);

                // 初始化状态管理
                await statusManager.loadStatus(currentArticleID);

                const panel = document.getElementById('publish-status-panel');
                statusManager.renderStatusPanel(currentArticleID, panel);
            } catch (error) {
                console.error('初始化失败:', error);
            }
        })();
    </script>
</body>
</html>
